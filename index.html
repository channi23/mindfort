;line-height:1.35;margin:15px 0 25px}.answer{text-align:left;border-top:1px solid #eee8f4;padding-top:20px;margin-top:20px}.answer p{font-size:13px;color:#666575}.association{background:#fff6e7;padding:15px;border-radius:10px;margin:15px 0}.answer h3{margin:7px 0}.review-buttons{display:flex;justify-content:center;gap:10px;margin-top:22px}.review-status{text-align:center;color:#8c899b;font-size:11px;margin-top:20px}.modal-screen{position:fixed;inset:0;z-index:20;background:#151629a6;display:grid;place-items:center;padding:18px}.modal{background:white;border-radius:18px;width:min(550px,100%);max-height:92vh;overflow:auto;padding:26px;box-shadow:0 25px 65px #0004}.modal-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.close{border:0;background:#f3f0f7;border-radius:9px;padding:7px 11px;font-size:16px}.modal p{font-size:12px;color:#898397;margin-bottom:18px}.form{display:grid;gap:16px}.form label{font-size:12px;font-weight:800;display:grid;gap:7px}.form input,.form textarea{padding:12px;border:1px solid #ddd7e7;border-radius:9px;font-size:13px;resize:vertical;width:100%}.form-actions{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #f0edf4;padding-top:18px;flex-wrap:wrap}.form-actions .danger{margin-right:auto}.toast{position:fixed;bottom:20px;right:20px;padding:14px 18px;border-radius:11px;background:#24233d;color:white;box-shadow:0 15px 30px #0003;font-size:12px;z-index:30}.empty{background:white;border:1px solid #eee7f3;text-align:center;padding:60px 25px;border-radius:17px}.empty p{font-size:13px;color:#9692a0;margin:13px 0 21px}.footer{border-top:1px solid #eee;background:white;padding:20px 48px;color:#aaa3b0;font-size:11px}.mobile-nav{display:none}@media(max-width:1100px){.cards,.room-grid,.list{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:35px}.bar{padding:0 35px}.hero-icon{font-size:120px}.palace-title{align-items:start;flex-direction:column}}@media(max-width:700px){.side{display:none}.mai </style></head><body><div id="app"></div><script>
'use strict';
const rooms=[{id:'kitchen',name:'Kitchen',emoji:'🍳',hint:'Where ideas come together',objects:[['fridge','Refrigerator','🧊',18,42],['cupboard','Cupboard','🗄️',42,23],['stove','Stove','🍲',77,49],['table','Dining table','🍽️',48,72],['sink','Sink','🚰',81,21]]},{id:'bedroom',name:'Bedroom',emoji:'🛏️',hint:'Rest your thoughts here',objects:[['bed','Bed','🛏️',51,65],['wardrobe','Wardrobe','🚪',19,36],['lamp','Bedside lamp','💡',80,49],['desk','Study desk','📚',76,19],['window','Window','🪟',47,20]]},{id:'living',name:'Living room',emoji:'🛋️',hint:'Make connections',objects:[['sofa','Sofa','🛋️',48,68],['tv','Television','📺',48,21],['shelf','Bookshelf','📚',17,36],['plant','House plant','🪴',81,37],['coffee','Coffee table','☕',76,68]]}];
const demo={id:'os-demo',name:'Operating Systems',subject:'Computer Science',memories:[{id:'thread',room:'kitchen',object:'fridge',title:'Threads share memory',explanation:'Threads in one process share an address space and many resources. Each thread has its own stack and registers.',association:'Imagine four chefs sharing ONE refrigerator. Each chef carries a personal recipe notebook, like a private stack.',cue:'What do threads in one process share, and what remains private?'},{id:'mutex',room:'kitchen',object:'cupboard',title:'Mutex lock',explanation:'A mutex allows only one thread to enter a protected critical section at a time.',association:'A golden cupboard key can only be held by one chef at a time, so no two chefs can reach the cupboard together.',cue:'How does a mutex protect a critical section?'},{id:'process',room:'bedroom',object:'bed',title:'Process isolation',explanation:'Processes normally have separate virtual address spaces, unlike threads within the same process.',association:'Each person sleeps in a separate locked bedroom containing private belongings.',cue:'How does process isolation differ from thread memory sharing?'},{id:'pages',room:'living',object:'shelf',title:'Virtual memory pages',explanation:'Virtual memory uses pages mapped to physical frames. Access to an unmapped or unavailable page can trigger a page fault.',association:'Imagine a librarian retrieving a missing book from another shelf before you can read it.',cue:'What is a page fault?'}],reviews:[]};
const key='mindfort:standalone-v1';let data;try{const saved=JSON.parse(localStorage.getItem(key));data=Array.isArray(saved)&&saved.every(p=>p&&typeof p.id==='string'&&Array.isArray(p.memories)&&Array.isArray(p.reviews))?saved:[structuredClone(demo)]}catch{data=[structuredClone(demo)]}
let page='home',selected=null,roomId='kitchen',locusId=null,reviewIndex=0,revealed=false,reviewScope='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>data.find(p=>p.id===selected);const room=()=>rooms.find(r=>r.id===roomId);const uuid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('Unable to save. Export a backup before closing this page.')}}function notice(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),3000)}function go(next){page=next;render();scrollTo(0,0)}function enter(id){selected=id;go('palace')}function enterRoom(id){roomId=id;go('room')}function getMemory(id){return current().memories.find(m=>m.room===roomId&&m.object===id)}function startRecall(scope='all'){reviewScope=scope;reviewIndex=0;revealed=false;go('recall')}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mindfort-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importClick(){$('import-file').click()}async function importData(input){const f=input.files?.[0];if(!f)return;try{if(f.size>2000000)throw Error();const v=JSON.parse(await f.text());if(!Array.isArray(v)||!v.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.memories)&&Array.isArray(p.reviews)&&p.memories.every(m=>rooms.some(r=>r.id===m.room&&r.objects.some(o=>o[0]===m.object))&&['id','title','explanation','association','cue'].every(k=>typeof m[k]==='string'))&&p.reviews.every(r=>typeof r.correct==='boolean'&&typeof r.at==='string')))throw Error();if(confirm('Replace every existing fortress with this backup? Export first if you want to keep them.')){data=v;save();selected=null;go('home');notice('Backup imported')}}catch{alert('Invalid Mindfort JSON backup')}finally{input.value=''}}function shell(content){$('app').innerHTML='<div class="app"><aside class="side"><div class="logo"><span>♜</span> mindfort.</div><small>WORKSPACE</small><button class="nav '+(page==='home'?'active':'')+'" onclick="go(\'home\')">⌂ &nbsp; My fortresses</button>'+(current()?'<button class="nav '+(page==='palace'||page==='room'?'active':'')+'" onclick="go(\'palace\')">▦ &nbsp; Explore palace</button><button class="nav '+(page==='recall'?'active':'')+'" onclick="startRecall()">◉ &nbsp; Recall practice</button>':'')+'<small style="margin-top:35px">YOUR FORTRESSES</small>'+data.map(p=>'<button class="nav" onclick="enter(\''+esc(p.id)+'\')">🏰 &nbsp; '+esc(p.name)+'</button>').join('')+'<button class="nav" onclick="newPalace()">＋ &nbsp; New fortress</button><div class="side-bottom">✦ Attach vivid mental pictures to familiar places.<br><br>♧ Private by design · Stored in your browser</div></aside><main class="main"><header class="bar"><div><button onclick="go(\'home\')">My fortresses</button> '+(current()&&page!=='home'?' / '+esc(current().name):'')+(page==='room'?' / '+esc(room().name):'')+'</div><div class="backup"><button onclick="exportData()">↓ Export backup</button> · <button onclick="importClick()">↑ Import</button></div></header><div class="page">'+content+'</div><footer class="footer">Mindfort · Build a world of knowledge. &nbsp; Everything stays on this device unless you export it.</footer></main></div><nav class="mobile-nav"><button onclick="go(\'home\')">⌂ Home</button><button onclick="current()?go(\'palace\'):go(\'home\')">▦ Explore</button><button onclick="current()?startRecall():go(\'home\')">◉ Recall</button><button onclick="newPalace()">＋ Create</button></nav><input id="import-file" hidden type="file" accept=".json,application/json" onchange="importData(this)"><div id="dialog"></div>'}
function render(){if(page==='home')return renderHome();if(!current()){page='home';return renderHome()}if(page==='palace')return renderPalace();if(page==='room')return renderRoom();if(page==='recall')return renderRecall()}
function renderHome(){shell('<div class="hero"><div><div class="eyebrow">✦ THE ART OF REMEMBERING</div><h1>Give every idea<br><em>a place to live.</em></h1><p class="subtitle">Build your own memory palace. Turn everyday rooms and objects into unforgettable knowledge, one idea at a time.</p><div class="actions"><button class="btn primary" onclick="newPalace()">＋ Create a fortress</button><button class="btn secondary" onclick="enter(\''+(data[0]?.id||'')+'\')" '+(!data.length?'disabled':'')+'>Explore a fortress →</button></div></div><div class="hero-icon">🏰<div class="float">✦ Make knowledge memorable</div></div></div><div class="heading"><h2>Your fortresses <small>('+data.length+')</small></h2><button class="btn secondary" onclick="exportData()">↓ Backup</button></div><div class="cards">'+data.map((p,i)=>'<button class="card" onclick="enter(\''+esc(p.id)+'\')"><div class="card-cover">'+['🏛️','🏰','🏡'][i%3]+'</div><div class="card-body"><small>'+esc(p.subject||'YOUR STUDIES')+'</small><h3>'+esc(p.name)+'</h3><p>'+p.memories.length+' memories · '+p.reviews.length+' reviews</p><div class="progress"><i style="width:'+Math.min(100,p.memories.length/15*100)+'%"></i></div></div></button>').join('')+'<button class="add-card" onclick="newPalace()"><span style="font-size:36px">⊕</span><b>Create a new fortress</b><small>Start a new world of knowledge</small></button></div><div class="feature-row"><div class="feature"><span>🚪</span><h3>01. Choose a place</h3><p>Find a familiar room and an object to hold an idea.</p></div><div class="feature"><span>✨</span><h3>02. Create a story</h3><p>Invent a vivid, unusual mental image tied to the object.</p></div><div class="feature"><span>🧠</span><h3>03. Recall it later</h3><p>Return, hide your notes, and reconstruct what you learned.</p></div></div>')}
function renderPalace(){const p=current();shell('<button class="back" onclick="go(\'home\')">← All fortresses</button><div class="palace-title"><div><div class="eyebrow">YOUR KNOWLEDGE FORTRESS</div><h1>'+esc(p.name)+'</h1><p class="subtitle">Every room holds ideas. Every object is a memory waiting to be found.</p></div><div class="stats"><div><b>'+p.memories.length+'</b><span>Memories</span></div><div><b>'+p.reviews.length+'</b><span>Recall attempts</span></div><div><b>'+Math.round(p.memories.length/15*100)+'%</b><span>Space filled</span></div></div></div><div class="progress"><i style="width:'+p.memories.length/15*100+'%"></i></div><div class="actions"><button class="btn primary" onclick="startRecall()">◉ Practice recall</button><button class="btn danger" onclick="deletePalace()">♻ Delete fortress</button></div><div style="margin-top:48px"><h2>Explore your rooms</h2><p class="subtitle">Pick a room to place memories or revisit concepts.</p></div><div class="room-grid">'+rooms.map(r=>'<button class="roomcard" onclick="enterRoom(\''+r.id+'\')"><div class="room-cover">'+r.emoji+'</div><div class="room-foot"><span><strong>'+r.name+'</strong><small>'+p.memories.filter(m=>m.room===r.id).length+' / 5 memories</small></span>→</div></button>').join('')+'</div>')}
function renderRoom(){const p=current(),r=room();shell('<button class="back" onclick="go(\'palace\')">← Back to fortress</button><div class="palace-title"><div><div class="eyebrow">'+esc(p.name.toUpperCase())+' / ROOM</div><h1>'+r.name+' '+r.emoji+'</h1><p class="subtitle">'+r.hint+'. Click a piece of furniture to attach a concept.</p></div><button class="btn secondary" onclick="startRecall(\''+r.id+'\')">◉ Practice room</button></div><div class="scene-wrap"><div class="scene-top">● INTERACTIVE MEMORY ROOM · CLICK AN OBJECT</div><div class="scene '+r.id+'"><div class="room-backdrop"></div>'+r.objects.map(o=>{const m=getMemory(o[0]);return '<button class="object '+(m?'filled':'')+'" style="left:'+o[3]+'%;top:'+o[4]+'%" onclick="editMemory(\''+o[0]+'\')"><span class="emoji">'+o[2]+'</span><span class="name">'+o[1]+'</span><span class="state">'+(m?'✓':'+')+'</span></button>'}).join('')+'</div><div class="scene-bottom"><span>🟢 Occupied object</span><span>🟣 Empty object</span></div></div><div style="margin-top:37px"><h2>Objects in this room</h2><p class="subtitle">A location becomes a cue for remembering its concept.</p></div><div class="list">'+r.objects.map(o=>{const m=getMemory(o[0]);return '<button class="slot" onclick="editMemory(\''+o[0]+'\')"><span class="emoji">'+o[2]+'</span><span><b>'+o[1]+'</b><small>'+esc(m?m.title:'Add a memory')+'</small></span></button>'}).join('')+'</div>')}
function reviewList(){return current().memories.filter(m=>reviewScope==='all'||m.room===reviewScope)}
function renderRecall(){const p=current(),list=reviewList(),m=list[reviewIndex%Math.max(1,list.length)];shell('<button class="back" onclick="go(\'palace\')">← Back to fortress</button><div class="recall"><div class="recall-head"><div class="eyebrow">ACTIVE RECALL</div><h1>Walk through your memories.</h1><p>Picture the place. Recall the idea before revealing your notes.</p><div style="margin-top:16px"><button class="btn secondary" onclick="startRecall(\'all\')">All rooms</button> '+rooms.map(r=>'<button class="btn secondary" onclick="startRecall(\''+r.id+'\')">'+r.name+'</button>').join(' ')+'</div></div>'+(m?'<p style="font-size:12px;color:#888;text-align:center;margin-bottom:12px">Memory '+(reviewIndex%list.length+1)+' of '+list.length+'</p><div class="review-card"><div class="review-place"><span>'+rooms.find(r=>r.id===m.room).objects.find(o=>o[0]===m.object)[2]+'</span><div><small>PICTURE THIS LOCATION</small><h2>'+esc(rooms.find(r=>r.id===m.room).objects.find(o=>o[0]===m.object)[1])+'</h2><small>'+esc(rooms.find(r=>r.id===m.room).name)+'</small></div></div><div class="review-body"><small>YOUR RECALL PROMPT</small><h2>'+esc(m.cue)+'</h2>'+(revealed?'<div class="answer"><small>THE CONCEPT</small><h3>'+esc(m.title)+'</h3><p>'+esc(m.explanation)+'</p><div class="association"><small>MENTAL IMAGE</small><p>'+esc(m.association)+'</p></div></div><div class="review-buttons"><button class="btn danger" onclick="grade(false)">↻ Need to revisit</button><button class="btn primary" onclick="grade(true)">✓ I remembered</button></div>':'<p style="font-size:12px;color:#9690a1;margin:15px 0">Try to remember the explanation and your mental picture.</p><button class="btn primary" onclick="reveal()">Reveal memory →</button>')+'</div></div><div class="review-status">'+p.reviews.filter(r=>r.correct).length+' successful recall attempts · <button class="back" onclick="skip()" style="margin:0">Skip this memory →</button></div>':'<div class="empty"><h2>Nothing to recall yet</h2><p>Attach a concept to a location first.</p><button class="btn primary" onclick="go(\'palace\')">Explore rooms →</button></div>')+'</div>')}
function reveal(){revealed=true;renderRecall()}function grade(correct){const list=reviewList(),m=list[reviewIndex%list.length];current().reviews.push({memoryId:m.id,correct,at:new Date().toISOString()});save();skip()}function skip(){reviewIndex++;revealed=false;renderRecall()}
function dialog(title,body){$('dialog').innerHTML='<div class="modal-screen" onclick="if(event.target===this)closeDialog()"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-title"><h2>'+esc(title)+'</h2><button class="close" onclick="closeDialog()" aria-label="Close">×</button></div>'+body+'</div></div>'}function closeDialog(){$('dialog').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
function newPalace(){dialog('Create a new fortress','<p>Choose a subject. You will get three rooms and fifteen memory locations.</p><form class="form" onsubmit="createNew(event)"><label>Fortress name<input id="new-name" placeholder="e.g. Human Anatomy" maxlength="80" required autofocus></label><label>Subject<input id="new-subject" placeholder="e.g. Biology" maxlength="60"></label><div class="form-actions"><button type="button" class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn primary">＋ Create fortress</button></div></form>')}
function createNew(e){e.preventDefault();const name=$('new-name').value.trim();if(!name)return;const p={id:uuid(),name,subject:$('new-subject').value.trim()||'My studies',memories:[],reviews:[]};data.unshift(p);save();enter(p.id)}
function deletePalace(){if(!confirm('Permanently delete this fortress and its memories?'))return;data=data.filter(p=>p.id!==selected);save();selected=null;go('home')}
function editMemory(id){locusId=id;const o=room().objects.find(o=>o[0]===id),m=getMemory(id);dialog((m?'Edit':'Add')+' · '+o[1],'<p>Place the concept inside this familiar location. A strange, vivid association usually works better than simply copying a definition.</p><form class="form" onsubmit="saveMemory(event)"><label>Concept title<input id="m-title" maxlength="100" required value="'+esc(m?.title||'')+'" placeholder="e.g. Threads share memory"></label><label>Explanation<textarea id="m-explanation" rows="3" maxlength="1500" required placeholder="Explain it in your own words">'+esc(m?.explanation||'')+'</textarea></label><label>Vivid mental association<textarea id="m-association" rows="3" maxlength="1200" required placeholder="Imagine four chefs using the same giant refrigerator...">'+esc(m?.association||'')+'</textarea></label><label>Recall question<textarea id="m-cue" rows="2" maxlength="500" required placeholder="What do threads in one process share?">'+esc(m?.cue||'')+'</textarea></label><div class="form-actions">'+(m?'<button type="button" class="btn danger" onclick="removeMemory()">Delete</button>':'')+'<button type="button" class="btn secondary" onclick="closeDialog()">Cancel</button><button class="btn primary">✓ Save memory</button></div></form>')}
function saveMemory(e){e.preventDefault();const old=getMemory(locusId),m={id:old?.id||uuid(),room:roomId,object:locusId,title:$('m-title').value.trim(),explanation:$('m-explanation').value.trim(),association:$('m-association').value.trim(),cue:$('m-cue').value.trim()};if(Object.values(m).some(v=>!v))return;if(old)Object.assign(old,m);else current().memories.push(m);save();renderRoom();notice('Memory saved')}
function removeMemory(){const m=getMemory(locusId);if(!m||!confirm('Remove this memory?'))return;current().memories=current().memories.filter(v=>v.id!==m.id);current().reviews=current().reviews.filter(v=>v.memoryId!==m.id);save();renderRoom();notice('Memory deleted')}
render();
</script></body></html>
